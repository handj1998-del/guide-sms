<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e31c23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="안내 문자 발송">
  <title>안내 문자 발송</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="eyebrow">롯데렌터카 김해공항</div>
        <h1>안내 문자 발송</h1>
      </div>
    </header>
    <main class="screens">
      <section class="screen active" data-tab="send">
        <div class="card">
          <label class="field-label" for="tpl-select">템플릿</label>
          <select id="tpl-select" class="select-wrap"></select>
        </div>
        <div class="card">
          <label class="field-label" for="phone">고객 휴대폰 번호</label>
          <input id="phone" class="field" type="tel" inputmode="numeric" placeholder="010-1234-5678">
          <div id="phone-msg" class="phone-bad">고객 휴대폰 번호를 입력해 주세요.</div>
        </div>
        <div class="card">
          <label class="field-label" for="reply-phone">회신(문의) 전화번호</label>
          <input id="reply-phone" class="field" type="tel" inputmode="numeric" placeholder="예: 051-941-0000">
        </div>
        <div>
          <h2 style="font-size:15px;margin:4px 2px 8px">입력 항목</h2>
          <div id="dyn-fields"></div>
        </div>
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <h2 style="margin:0">미리보기</h2>
            <span id="sms-badge" class="badge sms">SMS</span>
          </div>
          <div class="preview" id="preview">미리보기가 여기에 표시됩니다.</div>
          <div class="meta-bar">
            <span id="count-info">0자 · 0바이트</span>
            <span>90바이트 초과 시 LMS</span>
          </div>
          <p class="warn-line" id="preview-warn" style="display:none"></p>
        </div>
        <button class="btn primary" id="btn-sms" type="button">문자 앱 열기</button>
        <button class="btn secondary" id="btn-copy" type="button">복사</button>
      </section>
      <section class="screen" data-tab="tpl">
        <button class="btn primary" id="btn-new-tpl" type="button">템플릿 추가</button>
        <div class="card" style="padding:12px;margin-top:12px">
          <div class="btn-row">
            <button class="mini" id="btn-export" type="button">내보내기</button>
            <button class="mini" id="btn-import-add" type="button">가져오기(추가)</button>
            <button class="mini danger" id="btn-import-replace" type="button">가져오기(전체 교체)</button>
          </div>
          <input class="hidden-file" id="import-file" type="file" accept="application/json,.json">
        </div>
        <div id="tpl-list"></div>
      </section>
      <section class="screen" data-tab="hist">
        <div class="notice">이 앱의 기록은 90일 후 자동 삭제됩니다. 휴대폰 문자 앱에 남은 문자는 이 앱이 지울 수 없으니 문자 앱에서 직접 삭제해 주세요.</div>
        <input id="hist-search" class="search" type="search" placeholder="이름, 번호, 내용 검색">
        <button class="btn danger" id="btn-hist-clear" type="button">기록 전체 삭제</button>
        <div id="hist-list" style="margin-top:12px"></div>
      </section>
    </main>
    <nav class="nav">
      <button type="button" class="active" data-tab="send">발송</button>
      <button type="button" data-tab="tpl">템플릿</button>
      <button type="button" data-tab="hist">기록</button>
    </nav>
  </div>
  <div class="modal-back" id="editor-modal">
    <div class="modal">
      <h3 id="editor-title">템플릿 추가</h3>
      <input id="tpl-name" class="field" placeholder="템플릿 이름">
      <textarea id="tpl-body" class="field" placeholder="본문"></textarea>
      <div class="chip-row" id="token-chips">
        <button type="button" class="chip" data-token="이름">{이름}</button>
        <button type="button" class="chip" data-token="계약번호">{계약번호}</button>
        <button type="button" class="chip" data-token="차량번호">{차량번호}</button>
        <button type="button" class="chip" data-token="날짜">{날짜}</button>
        <button type="button" class="chip" data-token="시간">{시간}</button>
        <button type="button" class="chip" data-token="문의전화">{문의전화}</button>
        <button type="button" class="chip" data-token="회신번호">{회신번호}</button>
      </div>
      <p class="hint" id="editor-meta"></p>
      <button class="btn ghost" id="btn-add-token" type="button">항목 직접 추가</button>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn ghost" id="editor-close" type="button">닫기</button>
        <button class="btn primary" id="editor-save" type="button">저장</button>
      </div>
    </div>
  </div>
  <div class="modal-back" id="confirm-modal">
    <div class="modal center">
      <h3 id="confirm-title">확인</h3>
      <p id="confirm-msg" class="hint"></p>
      <div class="btn-row">
        <button class="btn ghost" id="confirm-cancel" type="button">취소</button>
        <button class="btn primary" id="confirm-ok" type="button">확인</button>
      </div>
    </div>
  </div>
  <div class="modal-back" id="prompt-modal">
    <div class="modal center">
      <h3 id="prompt-title">항목 추가</h3>
      <label class="field-label" id="prompt-label" for="prompt-input">이름</label>
      <input id="prompt-input" class="field">
      <div class="btn-row">
        <button class="btn ghost" id="prompt-cancel" type="button">취소</button>
        <button class="btn primary" id="prompt-ok" type="button">넣기</button>
      </div>
    </div>
  </div>
  <div class="install-banner" id="install-banner" style="display:none"></div>
  <div class="toast" id="toast"></div>
  <script src="./js/app.js"></script>
</body>
</html>
